name: Temporary Source Artifact

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Package source
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=frontend/.next \
            --exclude=frontend/out \
            -czf /tmp/relocation-source.tgz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: relocation-source
          path: /tmp/relocation-source.tgz
          retention-days: 1
          if-no-files-found: error
