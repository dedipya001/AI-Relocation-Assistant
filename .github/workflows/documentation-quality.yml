name: Documentation quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/documentation-quality.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/documentation-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate README and local links
        shell: bash
        run: |
          test -s README.md
          grep -q '^# ' README.md
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path.cwd()
          files = [Path('README.md'), *Path('docs').rglob('*.md')] if Path('docs').exists() else [Path('README.md')]
          errors = []
          for file in files:
              text = file.read_text(encoding='utf-8')
              if text.count('```') % 2:
                  errors.append(f'{file}: unclosed fenced code block')
              for target in re.findall(r'\[[^\]]+\]\(([^)]+)\)', text):
                  target = target.strip().split('#', 1)[0]
                  if not target or target.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  path = (file.parent / target).resolve()
                  try:
                      path.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f'{file}: link escapes repository: {target}')
                      continue
                  if not path.exists():
                      errors.append(f'{file}: missing local link target: {target}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(files)} Markdown file(s).')
          PY
