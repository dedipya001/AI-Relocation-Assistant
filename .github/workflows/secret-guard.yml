name: Secret Leak Prevention & Security Guard

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan Commits for Exposed Secrets & API Keys
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Custom High-Sensitivity Secret & API Key Guard
        shell: bash
        run: |
          echo "=========================================================="
          echo "🔒 SCANNING REPOSITORY COMMITS FOR EXPOSED CREDENTIALS"
          echo "=========================================================="

          VIOLATIONS=0
          
          # List of files to inspect (excluding node_modules, git, dist, tests mocks, lock files)
          FILES=$(git ls-files | grep -v -E "(\.png|\.jpg|\.jpeg|\.svg|\.ico|\.lock|\.json|node_modules|\.next|dist|out)")

          for file in $FILES; do
            if [ -f "$file" ]; then
              # 1. Scan for OpenAI API Keys (sk-proj-..., sk-...)
              if grep -E -n "sk-(proj-)?[a-zA-Z0-9_-]{20,}" "$file" | grep -v "sk-proj-placeholder" | grep -v "sk-placeholder" | grep -v "sk-proj-thikanakhojo" | grep -v "sk-proj-..." | grep -v "sk-..."; then
                echo "❌ [SECRET DETECTED] Potential OpenAI API Key in: $file"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi

              # 2. Scan for Mapbox Access Tokens (pk.eyJ..., sk.eyJ...)
              if grep -E -n "(pk|sk)\.eyJ[a-zA-Z0-9_-]{30,}" "$file" | grep -v "pk.eyJ1IjoicGxhY2Vob2xkZXIi" | grep -v "pk.eyJ1IjoiZGVmYXVsdC"; then
                echo "❌ [SECRET DETECTED] Real Mapbox Access Token in: $file"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi

              # 3. Scan for MongoDB / Redis Connection Strings with Passwords
              if grep -E -n "mongodb(\+srv)?:\/\/[a-zA-Z0-9._%-]+:[a-zA-Z0-9._%-]+@" "$file" | grep -v "username:password" | grep -v "user:pass"; then
                echo "❌ [SECRET DETECTED] Database Connection String with Credentials in: $file"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi

              # 4. Scan for Private RSA / PGP Keys
              if grep -E -n -e "-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----" "$file"; then
                echo "❌ [SECRET DETECTED] Private Key in: $file"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            fi
          done

          # Check if any .env or credential file was committed into git
          TRACKED_ENV=$(git ls-files | grep -E "(^\.env|\/\.env|\.env\.local|\.env\.production)" | grep -v "\.env\.example" || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "❌ [CRITICAL] Tracked environment file detected in git:"
            echo "$TRACKED_ENV"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          if [ $VIOLATIONS -gt 0 ]; then
            echo "=========================================================="
            echo "⛔ CRITICAL SECURITY FAILURE: $VIOLATIONS EXPOSED SECRET(S) DETECTED!"
            echo "📢 Committing API keys, private tokens, or database passwords to git is strictly forbidden."
            echo "⚠️ ACTION REQUIRED:"
            echo "   1. Remove the secret from your code immediately."
            echo "   2. Store the secret in backend/.env or GitHub Secrets."
            echo "   3. If a live key was committed, ROTATE IT IMMEDIATELY on OpenAI / Mapbox."
            echo "   4. Amend or rebase your commit to remove it from git history."
            echo "=========================================================="
            exit 1
          fi

          echo "✅ All scanned files are 100% clean. Zero exposed secrets detected."
