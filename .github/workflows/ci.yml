name: Continuous Integration & Typecheck

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'feat/**'
      - 'fix/**'
      - 'dedipya-dev'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-secret-scan:
    name: Scan Commits for Exposed Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Zero Tracked Secrets
        shell: bash
        run: |
          echo "🔍 Checking for uncommitted or exposed .env files..."
          TRACKED_ENV=$(git ls-files | grep -E "(^\.env|\/\.env|\.env\.local|\.env\.production)" | grep -v "\.env\.example" || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "❌ CRITICAL: .env file tracked in git: $TRACKED_ENV"
            exit 1
          fi

          echo "🔍 Scanning code for exposed OpenAI/Mapbox API keys..."
          FILES=$(git ls-files | grep -v -E "(\.png|\.jpg|\.jpeg|\.svg|\.ico|\.lock|\.json|node_modules|\.next|dist|out)")
          for file in $FILES; do
            if [ -f "$file" ]; then
              if grep -E -n "sk-(proj-)?[a-zA-Z0-9_-]{20,}" "$file" | grep -v "sk-proj-placeholder" | grep -v "sk-placeholder" | grep -v "sk-proj-thikanakhojo" | grep -v "sk-proj-..." | grep -v "sk-..."; then
                echo "❌ Exposed API Key in: $file"
                exit 1
              fi
            fi
          done
          echo "✅ Security check passed. Zero secrets exposed."

  backend-typecheck-and-test:
    name: Backend Typecheck & Build
    needs: [security-and-secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build Backend (tsc)
        working-directory: backend
        run: npm run build

      - name: Run Recommendation Benchmark Tests
        working-directory: backend
        run: npm run test:bench

  frontend-typecheck-and-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build Next.js Production App
        working-directory: frontend
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:8001/api/v1"
        run: npm run build
