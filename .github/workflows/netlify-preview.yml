name: Netlify Preview Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend-only static preview
        env:
          NETLIFY_STATIC_DEPLOY: "true"
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ""
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        run: npm --prefix frontend run build

      - name: Deploy anonymously to Netlify
        id: netlify
        shell: bash
        run: |
          set -euo pipefail
          npx -y netlify-cli@latest deploy \
            --allow-anonymous \
            --created-via cli \
            --prod \
            --dir frontend/out \
            --no-build \
            --json > /tmp/netlify-deploy.json
          node <<'NODE'
          const fs = require('fs');
          const deploy = JSON.parse(fs.readFileSync('/tmp/netlify-deploy.json', 'utf8'));
          const url = deploy.site_url || deploy.url || deploy.deploy_url || deploy.deployUrl || deploy.ssl_url;
          if (!url || !deploy.claim_url) {
            console.error(`Netlify deploy completed but required fields were missing. Keys: ${Object.keys(deploy).join(', ')}`);
            process.exit(1);
          }
          fs.writeFileSync('/tmp/netlify-claim.txt', deploy.claim_url, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Netlify preview\n\n${url}\n`);
          console.log(`Netlify preview URL: ${url}`);
          NODE

          cat > /tmp/netlify-claim-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApMXMoOyZBzTACGfVRPWJ
          LPugVSAq/w07caaQP+Mo0zwwpabQss/3hTf7cVm1eQ0ifWDsUHl3f+CfbFEy/VVy
          j7meos5EhSQQ4bjs8PGy9CL3ocp6/oskdHpaKd88Jbvr8u0LkLVRFAJq9apDjnAa
          JO7jLFOwFWiu0u0RIKqo7xzakLgDQxOiVCff/skqfjzKetHi64rYmAun3uMtktJa
          jJxWsGV4kpvmQPnV8g8bFGpxXYDFwOgxEc+01CMhv/MqaUwKjpdw40RTUO7pVp1C
          eC6qyP7+VS8DieQx2EpPNkFPwlDcWF3vXIpzY+E2SL/bckdH6mQQZYcWRrY8q8xz
          0QIDAQAB
          -----END PUBLIC KEY-----
          PEM

          CLAIM_KEY="$(openssl rand -hex 32)"
          printf '%s' "$CLAIM_KEY" > /tmp/netlify-claim-key.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass pass:"$CLAIM_KEY" \
            -in /tmp/netlify-claim.txt \
            -out /tmp/netlify-claim.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/netlify-claim-public.pem \
            -in /tmp/netlify-claim-key.txt -out /tmp/netlify-claim-key.enc

          echo "NETLIFY_CLAIM_KEY_BLOB=$(base64 -w0 /tmp/netlify-claim-key.enc)"
          echo "NETLIFY_CLAIM_DATA_BLOB=$(base64 -w0 /tmp/netlify-claim.enc)"

          unset CLAIM_KEY
          rm -f \
            /tmp/netlify-claim.txt \
            /tmp/netlify-claim-key.txt \
            /tmp/netlify-claim-key.enc \
            /tmp/netlify-claim.enc \
            /tmp/netlify-claim-public.pem \
            /tmp/netlify-deploy.json

      - name: Smoke-test deployed homepage
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 "${{ steps.netlify.outputs.url }}" > /tmp/netlify-home.html
          grep -qi "AI Relocation\|Thikana\|relocation" /tmp/netlify-home.html
          echo "Homepage smoke test passed: ${{ steps.netlify.outputs.url }}"
